[project]
name = "deskflow"
version = "0.1.0"
description = "Coworking desk & meeting-room booking platform (Django + DRF)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=6.1.2",
    "django-environ>=0.14.0",
    "djangorestframework>=3.18.3",
    "drf-spectacular>=0.30.0",
    "psycopg[binary]>=3.3.6",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.16.10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py"]

[tool.ruff]
extend-exclude = ["**/migrations"]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
"**/models.py" = ["RUF012"]  # Django Meta.constraints/ordering lists are idiomatic
