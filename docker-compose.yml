services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: deskflow
      POSTGRES_USER: deskflow
      POSTGRES_PASSWORD: deskflow
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deskflow"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  web:
    build: .
    env_file: .env
    environment: &app-env
      DATABASE_URL: postgres://deskflow:deskflow@db:5432/deskflow
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    volumes: [".:/app"]
    depends_on: &app-deps
      db: { condition: service_healthy }
      redis: { condition: service_started }

  worker:
    build: .
    command: celery -A config worker -l info
    env_file: .env
    environment: *app-env
    volumes: [".:/app"]
    depends_on: *app-deps

  beat:
    build: .
    command: celery -A config beat -l info
    env_file: .env
    environment: *app-env
    volumes: [".:/app"]
    depends_on: *app-deps

volumes:
  pgdata:
